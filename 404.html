<style>
/* 404 page. Everything is in this one file. Fonts and links start from the site root (/),
   because GitHub Pages shows this page at whatever address was typed, however deep. */

@font-face {
  font-family: "Outfit";
  src: url("/assets/fonts/static/Outfit-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "Outfit";
  src: url("/assets/fonts/static/Outfit-SemiBold.ttf") format("truetype");
  font-weight: 600;
  font-style: normal;
  font-display: swap;
}

:root {
  --ink: #22313a;
  --night-ink: #fff7ea;
  --night-soft: #cdd0e6;
  --gold: #ffd27a;
  --hills: clamp(150px, 32vh, 330px);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #141a33;
  color: var(--night-soft);
  font: 18px/1.6 "Outfit", system-ui, sans-serif;
}

a {
  color: var(--gold);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.18em;
}

a:hover { text-decoration-thickness: 2px; }

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
  border-radius: 4px;
}

/* the whole screen is the evening sky */
.lost {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(180deg, #141a33 0%, #1d2547 40%, #343b69 72%, #575683 100%);
}

.sky {
  position: absolute;
  inset: 0;
  z-index: -1;
  width: 100%;
  height: 100%;
}

.hills {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: var(--hills);
}

.message {
  position: relative;
  z-index: 1;
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px calc(var(--hills) * 0.8);
  text-align: center;
}

.code {
  margin: 0 0 12px;
  color: var(--gold);
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.24em;
}

h1 {
  margin: 0;
  color: var(--night-ink);
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.message p {
  max-width: 30em;
  margin: 16px auto 0;
  font-size: clamp(1.05rem, 1.8vw, 1.2rem);
  text-wrap: pretty;
}

.message .code { margin: 0 0 12px; }

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 14px 26px;
  margin-top: 30px;
}

.btn {
  display: inline-block;
  padding: 12px 24px;
  border-radius: 999px;
  background: var(--gold);
  color: var(--ink);
  font-weight: 600;
  text-decoration: none;
}

.btn:hover { background: #ffe1a6; }
.btn:focus-visible { border-radius: 999px; }

/* the only motion: the last light warms up behind the hills, then one shooting star */
.glow { animation: glow 2.6s ease-out 0.2s both; }

.shooting {
  opacity: 0;
  animation: shoot 1.4s cubic-bezier(0.25, 0.1, 0.25, 1) 1.4s;
}

@keyframes glow {
  from { opacity: 0.3; }
  to   { opacity: 1; }
}

@keyframes shoot {
  0%   { opacity: 0; transform: translate(0, 0); }
  20%  { opacity: 1; }
  100% { opacity: 0; transform: translate(460px, 175px); }
}

@media (prefers-reduced-motion: reduce) {
  .glow,
  .shooting {
    animation: none;
  }
}

@media (max-width: 600px) {
  body { font-size: 17px; }
  .message { padding: 32px 16px calc(var(--hills) * 0.75); }
}
</style>
